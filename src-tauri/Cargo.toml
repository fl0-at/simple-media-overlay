[package]
name = "simple-media-overlay"
version = "1.0.7-1"
description = "A simple media overlay that also lets you control media playback"
authors = ["Florian Löffler"]
license = "MIT"
repository = "https://github.com/fl0-at/simple-media-overlay"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
base64 = "0.22.1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
urlencoding = "2.1"

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
win-gsmtc = "0.1.0"
raw-window-handle = "0.6"
lazy_static = "1.4"
windows = { version = "0.58", features = [
  "Media_Control",
  "Media_Playback",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "implement"
] }
