[package]
name = "simple-media-overlay"
version = "0.10.2"
description = "A simple media overlay that also lets you control media playback"
authors = ["Florian Löffler"]
license = "MIT"
repository = "https://github.com/fl0-at/simple-media-overlay"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
win-gsmtc = "0.1.0"
base64 = "0.22.1"
raw-window-handle = "0.6"

windows = { version = "0.58", features = [
  "Media_Control",
  "Media_Playback",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "implement"
] }
