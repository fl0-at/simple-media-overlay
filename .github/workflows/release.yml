name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      channel:
        required: true
        type: string
      source:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing managed tag to resume (never creates a tag)
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        type: choice
        options: [development, stable]
      source:
        description: Full tested source SHA recorded in the annotated tag
        required: true
        type: string
  repository_dispatch:
    types: [release-requested]

permissions:
  contents: read

concurrency:
  group: release-publishing-${{ inputs.channel || github.event.client_payload.channel || 'invalid' }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      channel: ${{ steps.validate.outputs.channel }}
      source: ${{ steps.validate.outputs.source }}
    steps:
      - name: Validate explicit request
        id: request
        env:
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
          CHANNEL: ${{ inputs.channel || github.event.client_payload.channel }}
          SOURCE: ${{ inputs.source || github.event.client_payload.source }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:-dev\.[1-9][0-9]*)?$/.test(process.env.TAG)
              || !['development', 'stable'].includes(process.env.CHANNEL)
              || !/^[a-f0-9]{40}$/.test(process.env.SOURCE)) {
            throw new Error('Release request requires a managed SemVer tag, explicit channel, and full source SHA');
          }
          for (const key of ['TAG', 'CHANNEL', 'SOURCE']) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${key.toLowerCase()}=${process.env[key]}\n`);
          }
          JS
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.request.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Verify tag provenance and embedded versions
        id: validate
        env:
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.request.outputs.channel }}
          RELEASE_SOURCE: ${{ steps.request.outputs.source }}
        run: node scripts/validate-release.mjs

  tests:
    needs: validate
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}

  create-release:
    needs: [validate, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      complete: ${{ steps.release.outputs.complete }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Create or resume draft
        id: release
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
          RELEASE_SOURCE: ${{ needs.validate.outputs.source }}
        with:
          script: |
            const { beginRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-release.mjs`);
            const result = await beginRelease(github, context.repo, process.env);
            core.setOutput('release_id', result.id);
            core.setOutput('complete', result.complete);

  build-tauri:
    needs: [validate, create-release]
    if: needs.create-release.outputs.complete != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x86_64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: Build signed artifacts with the tagged embedded version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "ERROR: TAURI_SIGNING_PRIVATE_KEY is required"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ "$RELEASE_CHANNEL" = "development" ]; then
              npm run tauri build -- --bundles nsis -- --locked
            else
              npm run tauri build -- --bundles msi -- --locked
            fi
          else
            npm run tauri build -- --bundles appimage -- --locked
          fi
      - name: Collect installer, signature and updater metadata
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/collect-release.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: release-assets
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    needs: [validate, create-release, build-tauri]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Upload complete assets and publish
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
          RELEASE_SOURCE: ${{ needs.validate.outputs.source }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-release.mjs`);
            await publishRelease(github, context.repo, process.env);
