name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate release notes
        id: generate-notes
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG=${{ github.ref_name }}
          
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log ${PREVIOUS_TAG}..${CURRENT_TAG} --pretty=format:"- %s (%h)" --no-merges | grep -v "chore: bump version")
          fi
          
          # Start building release notes
          echo "## 🎉 Simple Media Overlay ${CURRENT_TAG}" > /tmp/release_notes.md
          echo "" >> /tmp/release_notes.md
          echo "Thank you for using Simple Media Overlay! This release includes the following updates:" >> /tmp/release_notes.md
          echo "" >> /tmp/release_notes.md
          
          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -E "^- (feat|feature):" | sed 's/^- feat: /- ✨ /' | sed 's/^- feature: /- ✨ /' || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- (fix|bugfix):" | sed 's/^- fix: /- 🐛 /' | sed 's/^- bugfix: /- 🐛 /' || true)
          PERF=$(echo "$COMMITS" | grep -E "^- (perf|performance):" | sed 's/^- perf: /- ⚡ /' | sed 's/^- performance: /- ⚡ /' || true)
          IMPROVEMENTS=$(echo "$COMMITS" | grep -E "^- (improve|enhancement):" | sed 's/^- improve: /- 🔧 /' | sed 's/^- enhancement: /- 🔧 /' || true)
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|feature|fix|bugfix|perf|performance|improve|enhancement|chore|docs|style|refactor|test|build|ci):" || true)
          
          if [ -n "$FEATURES" ]; then
            echo "### ✨ New Features" >> /tmp/release_notes.md
            echo "$FEATURES" >> /tmp/release_notes.md
            echo "" >> /tmp/release_notes.md
          fi
          
          if [ -n "$IMPROVEMENTS" ]; then
            echo "### 🔧 Improvements" >> /tmp/release_notes.md
            echo "$IMPROVEMENTS" >> /tmp/release_notes.md
            echo "" >> /tmp/release_notes.md
          fi
          
          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> /tmp/release_notes.md
            echo "$FIXES" >> /tmp/release_notes.md
            echo "" >> /tmp/release_notes.md
          fi
          
          if [ -n "$PERF" ]; then
            echo "### ⚡ Performance Improvements" >> /tmp/release_notes.md
            echo "$PERF" >> /tmp/release_notes.md
            echo "" >> /tmp/release_notes.md
          fi
          
          if [ -n "$OTHER" ]; then
            echo "### 📝 Other Changes" >> /tmp/release_notes.md
            echo "$OTHER" >> /tmp/release_notes.md
            echo "" >> /tmp/release_notes.md
          fi
          
          echo "---" >> /tmp/release_notes.md
          echo "" >> /tmp/release_notes.md
          echo "## 📦 Installation" >> /tmp/release_notes.md
          echo "" >> /tmp/release_notes.md
          echo "Download the installer for your platform from the assets below:" >> /tmp/release_notes.md
          echo "" >> /tmp/release_notes.md
          echo "- **Windows**: \`simple-media-overlay_${CURRENT_TAG#v}_x64_en-US.msi\`" >> /tmp/release_notes.md
          echo "" >> /tmp/release_notes.md
          echo "If you already have Simple Media Overlay installed, the app will automatically update to this version when you restart it! 🚀" >> /tmp/release_notes.md
          echo "" >> /tmp/release_notes.md
          
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}" >> /tmp/release_notes.md
          fi
          
          cat /tmp/release_notes.md

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releaseNotes = fs.readFileSync('/tmp/release_notes.md', 'utf8');
            
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              body: releaseNotes,
              draft: false,
              prerelease: false
            });
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Create and upload updater JSON
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $msiUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/simple-media-overlay_${version}_x64_en-US.msi"
          
          # Find the signature file
          Write-Host "Looking for signature file..."
          $sigFile = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.msi.sig" | Select-Object -First 1
          
          if (-not $sigFile) {
            Write-Error "Signature file not found!"
            exit 1
          }
          
          Write-Host "Found signature file at: $($sigFile.FullName)"
          $sigContent = Get-Content $sigFile.FullName -Raw
          
          $json = @{
            version = $version
            notes = "See release notes for details"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent.Trim()
                url = $msiUrl
              }
            }
          } | ConvertTo-Json -Depth 10
          
          $json | Out-File -FilePath "latest.json" -Encoding utf8
          
          Write-Host "Created latest.json:"
          Get-Content "latest.json"
          
          # Upload to release using GitHub CLI
          gh release upload ${{ github.ref_name }} latest.json --clobber
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
