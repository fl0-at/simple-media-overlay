name: Auto Version Bump

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - '.gitignore'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          BASE_VERSION=$(echo "$VERSION" | sed 's/-.*$//')
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT

      - name: Determine version bump type
        id: bump-type
        run: |
          # Check commit message for version bump indicators
          BRANCH_NAME="${{ github.ref_name }}"
          COMMIT_MSG=$(git log -1 --pretty=%B)

          if [ "$BRANCH_NAME" == "develop" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT

            if [[ "$COMMIT_MSG" =~ ^major: ]] || [[ "$COMMIT_MSG" =~ \[major\] ]] || [[ "$COMMIT_MSG" =~ BREAKING\ CHANGE ]]; then
              echo "type=major" >> $GITHUB_OUTPUT
            elif [[ "$COMMIT_MSG" =~ ^minor: ]] || [[ "$COMMIT_MSG" =~ \[minor\] ]]; then
              echo "type=minor" >> $GITHUB_OUTPUT
            elif [[ "$COMMIT_MSG" =~ ^patch: ]]; then
              echo "type=patch" >> $GITHUB_OUTPUT
            else
              echo "type=build" >> $GITHUB_OUTPUT
            fi

            exit 0
          fi
          
          # Skip version bump for non-versioned commits
          if [[ "$COMMIT_MSG" =~ ^chore: ]] || \
             [[ "$COMMIT_MSG" =~ ^docs: ]] || \
             [[ "$COMMIT_MSG" =~ ^style: ]] || \
             [[ "$COMMIT_MSG" =~ ^refactor: ]] || \
             [[ "$COMMIT_MSG" =~ ^test: ]] || \
             [[ "$COMMIT_MSG" =~ ^build: ]] || \
             [[ "$COMMIT_MSG" =~ ^ci: ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping version bump for non-versioned commit: $COMMIT_MSG"
            exit 0
          fi
          
          if [[ "$COMMIT_MSG" =~ \[major\] ]] || [[ "$COMMIT_MSG" =~ BREAKING\ CHANGE ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" =~ \[minor\] ]] || [[ "$COMMIT_MSG" =~ feat: ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        if: steps.bump-type.outputs.skip != 'true'
        id: bump
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          BUMP_TYPE="${{ steps.bump-type.outputs.type }}"
          IFS='.' read -r major minor patch <<< "${{ steps.get-version.outputs.base_version }}"

          if [ "$BRANCH_NAME" == "develop" ]; then
            NEW_BASE_VERSION="${{ steps.get-version.outputs.base_version }}"

            if [ "$BUMP_TYPE" == "major" ]; then
              major=$((major + 1))
              minor=0
              patch=0
              NEW_BASE_VERSION="$major.$minor.$patch"
            elif [ "$BUMP_TYPE" == "minor" ]; then
              minor=$((minor + 1))
              patch=0
              NEW_BASE_VERSION="$major.$minor.$patch"
            elif [ "$BUMP_TYPE" == "patch" ]; then
              patch=$((patch + 1))
              NEW_BASE_VERSION="$major.$minor.$patch"
            fi

            LAST_DEV_TAG=$(git tag -l "v${NEW_BASE_VERSION}-[0-9]*" --sort=-version:refname | head -n 1)

            if [ -n "$LAST_DEV_TAG" ]; then
              LAST_DEV_NUMBER=$(echo "$LAST_DEV_TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+-([0-9]+)$/\1/')
              NEXT_DEV_NUMBER=$((LAST_DEV_NUMBER + 1))
            else
              NEXT_DEV_NUMBER=1
            fi

            if [ "$NEXT_DEV_NUMBER" -gt 65535 ]; then
              echo "ERROR: prerelease number $NEXT_DEV_NUMBER exceeds MSI limit (65535)"
              exit 1
            fi

            NEW_VERSION="${NEW_BASE_VERSION}-${NEXT_DEV_NUMBER}"
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            if [ "$BUMP_TYPE" == "major" ]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif [ "$BUMP_TYPE" == "minor" ]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi

            NEW_BASE_VERSION="$major.$minor.$patch"
            NEW_VERSION="$NEW_BASE_VERSION"
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "New $BUMP_TYPE version: $NEW_VERSION"

      - name: Update package.json
        if: steps.bump-type.outputs.skip != 'true'
        run: |
          npm version ${{ steps.bump.outputs.new_version }} --no-git-tag-version

      - name: Update tauri.conf.json
        if: steps.bump-type.outputs.skip != 'true'
        run: |
          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.version = '${{ steps.bump.outputs.new_version }}';
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          "

      - name: Update Cargo.toml
        if: steps.bump-type.outputs.skip != 'true'
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.bump.outputs.new_version }}"/' src-tauri/Cargo.toml

      - name: Commit and tag
        if: steps.bump-type.outputs.skip != 'true'
        run: |
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD --tags

      - name: Trigger release workflow
        if: steps.bump-type.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'release-requested',
              client_payload: {
                tag: 'v${{ steps.bump.outputs.new_version }}'
              }
            });
            console.log('Triggered release workflow for v${{ steps.bump.outputs.new_version }}');

