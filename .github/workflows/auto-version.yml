name: Auto Version Bump

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  qualify:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.qualify.outputs.release }}
      channel: ${{ steps.qualify.outputs.channel }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release eligibility
        id: qualify
        env:
          BEFORE: ${{ github.event.before }}
          SOURCE: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { qualifies } from './scripts/release-eligibility.mjs';
          if (!['develop', 'master'].includes(process.env.BRANCH)) {
            throw new Error('Manual releases must run on develop or master');
          }
          const message = execFileSync('git', ['log', '-1', '--format=%B'], { encoding: 'utf8' });
          const botCommit = /^chore: release .* \[skip ci\]/.test(message);
          let eligible = process.env.EVENT === 'workflow_dispatch';
          if (!eligible) {
            const before = process.env.BEFORE;
            if (!/^[a-f0-9]{40}$/.test(before) || /^0+$/.test(before)) {
              throw new Error('Cannot determine changed files; use a manual run after inspecting the new branch');
            }
            const paths = execFileSync('git', ['diff', '--name-only', '-z', before, process.env.SOURCE], { encoding: 'utf8' })
              .split('\0').filter(Boolean);
            eligible = qualifies(paths);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `release=${eligible && !botCommit}\nchannel=${process.env.BRANCH === 'develop' ? 'development' : 'stable'}\n`);
          JS

  tests:
    needs: qualify
    if: needs.qualify.outputs.release == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.sha }}

  prepare:
    needs: [qualify, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Prepare immutable version commit and tag
        id: prepare
        env:
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_CHANNEL: ${{ needs.qualify.outputs.channel }}
        run: node scripts/prepare-release.mjs
      - name: Push only this tag
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

  release:
    needs: [qualify, prepare]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      channel: ${{ needs.qualify.outputs.channel }}
      source: ${{ github.sha }}
    secrets: inherit
